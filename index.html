<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212b">
<link rel="manifest" href="manifest.json">
<title>Debbi Tracker</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#68727d;--line:#d9dee3;--blue:#1769aa;--red:#b33a3a;--green:#287a4b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px}
header h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.75;margin-top:3px}
main{max-width:720px;margin:auto;padding:12px 12px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big{min-height:82px;border:0;border-radius:13px;font-size:17px;font-weight:800;color:white}
.med{background:#1769aa}.food{background:#a46616}.sym{background:#a8345b}
h2{font-size:16px;margin:0 0 10px}.timeline{display:flex;flex-direction:column;gap:8px}
.entry{border:1px solid var(--line);border-radius:11px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.time{font-weight:800}.type{font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#e9edf1}
.detail{margin-top:5px;font-size:14px}.mini{font-size:12px;color:var(--muted);margin-top:3px}
button{cursor:pointer}.smallbtn{border:0;background:#e9edf1;padding:6px 9px;border-radius:8px;font-weight:700}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{border:0;border-radius:9px;padding:9px 11px;font-weight:750}
.primary{background:var(--blue);color:white}.danger{background:#f6dddd;color:#8d2222}
dialog{width:min(94vw,520px);border:0;border-radius:16px;padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}
.modal{padding:16px}.modal h2{font-size:19px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.choice{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px;font-weight:700}
.choice.on{background:var(--ink);color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:16px}
textarea{min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.modal-actions button{border:0;border-radius:9px;padding:10px 13px;font-weight:800}
.cancel{background:#e9edf1}.save{background:var(--green);color:#fff}.empty{color:var(--muted);font-size:13px}.datebar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.datebar button{border:0;background:#e9edf1;border-radius:8px;padding:8px}.datebar strong{text-align:center}
@media(max-width:430px){.big{font-size:15px;min-height:76px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Debbi Tracker</h1><div class="sub">Real-time meds • food • symptoms</div></header>
<main>
<section class="card">
  <div class="actions">
    <button class="big med" onclick="openNew('med')">💊<br>MED</button>
    <button class="big food" onclick="openNew('food')">🍽️<br>FOOD</button>
    <button class="big sym" onclick="openNew('symptoms')">❤️<br>SYMPTOMS</button>
  </div>
</section>

<section class="card">
 <div class="datebar"><button onclick="moveDay(-1)">←</button><strong id="dayLabel"></strong><button onclick="moveDay(1)">→</button></div>
</section>

<section class="card">
 <h2>Timeline</h2><div id="timeline" class="timeline"></div>
</section>

<section class="card">
 <h2>Share / Backup</h2>
 <div class="toolbar">
  <button class="primary" onclick="exportChat()">Export for ChatGPT</button>
  <button onclick="exportBackup()">Backup data</button>
  <button onclick="document.getElementById('restore').click()">Restore</button>
  <input id="restore" type="file" accept=".json" hidden onchange="restoreBackup(event)">
 </div>
 <div class="mini">The tracker saves locally on this Pixel/browser. Backup occasionally.</div>
</section>
</main>

<dialog id="dlg"><div class="modal">
<h2 id="modalTitle"></h2>
<div id="modalBody"></div>
<div class="modal-actions"><button class="cancel" onclick="dlg.close()">Cancel</button><button class="save" onclick="saveEntry()">Save</button></div>
</div></dialog>

<script>
const KEY='debbi_tracker_v2';
const meds=['Sinemet IR 25/100','Crexont','Vyalev','Other'];
const amounts=['1/4 tablet','1/2 tablet','3/4 tablet','1 tablet','Other'];
const meals=['Breakfast','Lunch','Dinner','Snack','Drink / supplement','Other'];
const protein=['Low protein','Moderate protein','High protein','Not sure'];
const symptoms=['Burning crotch','Bladder urgency / spastic bladder','Back burning','Anxiety','Stiffness','Weakness','Fatigue','Sleepiness','Confusion','Dyskinesia','Nausea','Pain','Hallucination / dream-state','No symptoms / feeling good'];
let db=load(), selectedDay=localDate(new Date()), editId=null, mode=null, picked=new Set();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{version:2,events:[]}}catch(e){return{version:2,events:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function localDT(d=new Date()){return localDate(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openNew(t){editId=null;mode=t;picked.clear();buildModal({type:t,timestamp:localDT()});dlg.showModal()}
function editEntry(id){let e=db.events.find(x=>x.id===id); if(!e)return; editId=id;mode=e.type;picked=new Set(e.symptoms||[]);buildModal(e);dlg.showModal()}
function chips(list, chosen=[]){return '<div class="choices">'+list.map(x=>`<button type="button" class="choice ${chosen.includes(x)?'on':''}" data-v="${esc(x)}" onclick="toggleChoice(this)">${esc(x)}</button>`).join('')+'</div>'}
function toggleChoice(b){if(mode==='symptoms'){let v=b.dataset.v;picked.has(v)?picked.delete(v):picked.add(v);b.classList.toggle('on')}else{b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on')}}
function buildModal(e){
 modalTitle.textContent=(editId?'Edit ':'Add ')+(mode==='med'?'Medication':mode==='food'?'Food':'Symptoms');
 let dt=`<label>Time</label><input id="ts" type="datetime-local" value="${e.timestamp.slice(0,16)}">`;
 if(mode==='med') modalBody.innerHTML=dt+'<label>Medication</label>'+chips(meds,[e.med])+'<label>Amount</label>'+chips(amounts,[e.amount])+'<label>Note (optional)</label><input id="note" value="'+esc(e.note||'')+'">';
 if(mode==='food') modalBody.innerHTML=dt+'<label>Food</label>'+chips(meals,[e.meal])+'<label>Protein</label>'+chips(protein,[e.protein])+'<label>What she ate (optional)</label><input id="note" value="'+esc(e.note||'')+'" placeholder="Toast, cereal, sandwich...">';
 if(mode==='symptoms') modalBody.innerHTML=dt+'<label>Select all that apply</label>'+chips(symptoms,e.symptoms||[])+'<label>Note (optional)</label><textarea id="note">'+esc(e.note||'')+'</textarea>';
}
function selectedButtons(){return [...modalBody.querySelectorAll('.choice.on')].map(x=>x.dataset.v)}
function saveEntry(){
 let e={id:editId||crypto.randomUUID(),type:mode,timestamp:document.getElementById('ts').value,note:document.getElementById('note')?.value.trim()||''};
 let vals=selectedButtons();
 if(mode==='med'){e.med=vals.find(v=>meds.includes(v));e.amount=vals.find(v=>amounts.includes(v));if(!e.med||!e.amount)return alert('Choose medication and amount.')}
 if(mode==='food'){e.meal=vals.find(v=>meals.includes(v));e.protein=vals.find(v=>protein.includes(v));if(!e.meal||!e.protein)return alert('Choose food type and protein level.')}
 if(mode==='symptoms'){e.symptoms=[...picked];if(!e.symptoms.length&&!e.note)return alert('Choose at least one symptom or add a note.')}
 if(editId) db.events=db.events.map(x=>x.id===editId?e:x); else db.events.push(e);
 persist();selectedDay=e.timestamp.slice(0,10);dlg.close();render();
}
function del(id){if(confirm('Delete this entry?')){db.events=db.events.filter(x=>x.id!==id);persist();render()}}
function moveDay(n){let d=new Date(selectedDay+'T12:00');d.setDate(d.getDate()+n);selectedDay=localDate(d);render()}
function render(){
 let d=new Date(selectedDay+'T12:00');dayLabel.textContent=(selectedDay===localDate(new Date())?'Today — ':'')+d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
 let ev=db.events.filter(e=>e.timestamp.slice(0,10)===selectedDay).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
 timeline.innerHTML=ev.length?'':'<div class="empty">No entries for this day.</div>';
 ev.forEach(e=>{
  let detail=e.type==='med'?`${esc(e.med)} — ${esc(e.amount)}`:e.type==='food'?`${esc(e.meal)} — ${esc(e.protein)}${e.note?' • '+esc(e.note):''}`:`${(e.symptoms||[]).map(esc).join(' • ')}${e.note?' • '+esc(e.note):''}`;
  let label=e.type==='med'?'MED':e.type==='food'?'FOOD':'SYMPTOMS';
  timeline.insertAdjacentHTML('beforeend',`<div class="entry"><div class="top"><div><span class="time">${fmtTime(e.timestamp)}</span> <span class="type">${label}</span></div><div><button class="smallbtn" onclick="editEntry('${e.id}')">Edit</button> <button class="smallbtn" onclick="del('${e.id}')">Delete</button></div></div><div class="detail">${detail}</div></div>`);
 })
}
function exportChat(){
 let ev=[...db.events].sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
 let out='DEBBI TRACKER — MEDICATION / FOOD / SYMPTOM TIMELINE\n\n', last='';
 ev.forEach(e=>{let d=e.timestamp.slice(0,10);if(d!==last){out+='\n=== '+new Date(d+'T12:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' ===\n';last=d}
 let detail=e.type==='med'?`MED | ${e.med} | ${e.amount}`:e.type==='food'?`FOOD | ${e.meal} | ${e.protein}${e.note?' | '+e.note:''}`:`SYMPTOMS | ${(e.symptoms||[]).join(', ')}${e.note?' | '+e.note:''}`;
 out+=fmtTime(e.timestamp)+' | '+detail+'\n'});
 download(out,'debbi-tracker-for-chatgpt.txt','text/plain');
}
function exportBackup(){download(JSON.stringify(db,null,2),'debbi-tracker-backup.json','application/json')}
function restoreBackup(evt){let f=evt.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.events))throw 0;db=x;persist();render();alert('Backup restored.')}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
function download(txt,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
</script>
</body></html>
